# Sample xrootd/cmsd configuration: xrootd-multiuser with x509map X509/VOMS
# account mapping, SciTokens and Macaroons, for xroot and HTTPS (WebDAV).
#
# Installed as /etc/xrootd/xrootd-multiuser-x509map.cfg. Start it with the
# privileged units that xrootd-multiuser needs:
#   systemctl enable --now xrootd-privileged@multiuser-x509map
#   systemctl enable --now cmsd-privileged@multiuser-x509map    # if you run a cmsd
#
# Values to adapt for your site are marked "SITE:". See README.md, chapter 3,
# for the prerequisites (certificates, VOMS .lsc files, accounts, ...).
#
# How a request is authorized:
#   SciTokens -> Macaroons -> x509map -> authdb
#   - a valid token or macaroon decides the request before x509map;
#   - an X509 client is mapped by x509map to a local or pool account
#     (1. x509map-local.map by DN, 2. x509map-voms.map by VOMS FQAN) or denied;
#   - the authdb then grants path privileges to that account;
#   - xrootd-multiuser performs the file system operation with the account's
#     uid/gid (setfsuid).

# SITE: exported namespace and site name
all.export /xrd
all.sitename T3_XX_Example
all.role server

xrd.port 1094 if exec xrootd
xrootd.chksum adler32

# ---------------------------------------------------------------------------
# cmsd (redirector registration). SITE: remove this block if you do not run
# a cmsd, or point all.manager at your redirector.
xrd.port 3121 if exec cmsd
if exec cmsd
  cms.allow host *
  all.manager any cms-xrd-transit.cern.ch+ 1213
fi

# ---------------------------------------------------------------------------
# Authentication (xroot)
xrootd.seclib /usr/lib64/libXrdSec.so

# gsi (X509 proxies):
#  -vomsfun          extracts the VOMS FQANs into endorsements. Keep the default
#                    grpopt (useall) so every FQAN, not only the first, is seen.
#  -gmapopt:10       no grid-mapfile; the DN becomes the entity name. Every valid
#                    certificate can log in and x509map decides per request.
#                    Do not use -gmapopt:usemap (unknown DNs fail at login) and do
#                    not add -gridmap (a gridmap hit bypasses both x509map maps).
#  -moninfo          also keep the DN in moninfo for the plugins.
#  Do not add -authzfun: it overwrites the name and loses the attributes
#  multiuser needs on cached logins.
sec.protparm gsi -vomsfun:libXrdSecgsiVOMS.so -vomsfunparms:dbg
sec.protocol /usr/lib64 gsi -cert:/etc/grid-security/hostcert.pem -key:/etc/grid-security/hostkey.pem -dlgpxy:1 -exppxy:=creds -ca:1 -crl:3 -gmapopt:10 -moninfo

if exec xrootd
    # ztn: bearer tokens over xroot (validated by XrdAccSciTokens below)
    sec.protocol ztn

    # x509map, xroot only: right after a gsi login, put the mapped account in
    # the entity name (logs, monitoring, macaroon issuance). It never rejects a
    # login; enforcement is done by libXrdAccX509Map below. Keep the options
    # identical to the ofs.authlib line. Must stay inside "if exec xrootd".
    sec.entitylib /usr/lib64/libXrdSecEntityX509Map.so localmap=/etc/xrootd/x509map-local.map vomsmap=/etc/xrootd/x509map-voms.map minuid=1000 mingid=1000 cacheto=600

    # TLS for xroot and HTTPS. SITE: host certificate readable by xrootd.
    xrd.tls /etc/grid-security/xrd/xrdcert.pem /etc/grid-security/xrd/xrdkey.pem
    xrd.tlsca certdir /etc/grid-security/certificates
    xrootd.tls capable all

    # HTTPS / WebDAV. SITE: port.
    xrd.protocol http:2880 /usr/lib64/libXrdHttp.so
    http.cadir /etc/grid-security/certificates
    http.cert /etc/grid-security/xrd/xrdcert.pem
    http.key /etc/grid-security/xrd/xrdkey.pem
    # VOMS attributes of HTTPS clients; the DN is always passed in moninfo.
    # Do not add http.gridmap, for the same reason as the gsi -gridmap.
    http.secxtractor libXrdVoms.so
    # Pass "Authorization: Bearer ..." to SciTokens/Macaroons.
    http.header2cgi Authorization authz
    http.listingdeny yes
    http.desthttps yes
    # Macaroon issuance (POST with Content-Type: application/macaroon-request)
    http.exthandler xrdmacaroons libXrdMacaroons.so
fi

# ---------------------------------------------------------------------------
# Authorization
ofs.authorize
acc.authdb /etc/xrootd/x509map-authdb
acc.authrefresh 60
acc.audit deny

# SITE: create with e.g. "openssl rand -base64 -out /etc/xrootd/macaroon-secret 64"
# (owner xrootd, mode 0600).
macaroons.secretkey /etc/xrootd/macaroon-secret

# authlib stack. Each "++" wraps the authorizer built by the lines before it,
# so the LAST line is called FIRST: SciTokens -> Macaroons -> x509map -> authdb.
# libXrdAccX509Map must be the first "++" line: it maps (or denies) X509
# clients that no token decided, sets request.name for multiuser and then
# hands over to the authdb.
ofs.authlib ++ /usr/lib64/libXrdAccX509Map.so localmap=/etc/xrootd/x509map-local.map vomsmap=/etc/xrootd/x509map-voms.map minuid=1000 mingid=1000 cacheto=600
ofs.authlib ++ libXrdMacaroons.so
# SITE: issuers and their account mapping
ofs.authlib ++ libXrdAccSciTokens.so config=/etc/xrootd/scitokens.cfg

# ---------------------------------------------------------------------------
# Storage: run file system operations as the mapped account
ofs.osslib ++ libXrdMultiuser.so
ofs.crmode dirs 0775:0775 files 0664:0664
# Keep equal to minuid=/mingid= of the x509map lines (multiuser default 500).
multiuser.minuid 1000
multiuser.mingid 1000

# Logging. Reduce once the setup works.
sec.trace all
http.trace auth debug
scitokens.trace all
cms.trace all
